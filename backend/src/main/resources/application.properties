spring.application.name=kfokam48

# --- Port du serveur ---
server.port=8081

# --- Datasource : PostgreSQL en développement (voir README) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/kfokam48
spring.datasource.username=kfokam48
spring.datasource.password=kfokam48

# Schéma versionné par migrations Flyway, jamais par Hibernate (ENF4)
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Format d'erreur imposé { code, message } : on désactive le corps par défaut de Spring
spring.mvc.problemdetails.enabled=false
server.error.whitelabel.enabled=false