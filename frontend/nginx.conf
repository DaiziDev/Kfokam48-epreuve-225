# Même origine pour l'app et l'API, comme proxy.conf.json en développement :
# le frontend appelle /api (API_URL relatif), nginx le relaie au backend.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API et Swagger UI → conteneur backend (nom de service docker-compose)
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(swagger-ui|swagger-ui\.html|v3/api-docs) {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
    }

    # Fichiers JS/CSS nommés par empreinte : cache long sans risque
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA : toute route inconnue (/etudiant, /formateur…) renvoie index.html,
    # jamais mis en cache pour qu'un déploiement soit pris immédiatement
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
