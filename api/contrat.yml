openapi: 3.0.3
info:
  title: Contrat imposé — Épreuve finale KFOKAM48
  version: "1.0"
  description: |
    Les cinq opérations décrites ici doivent exister EXACTEMENT ainsi :
    mêmes chemins, mêmes verbes, mêmes codes de statut, même format d'erreur.
    Tout le reste de ton API est libre — ajoute tes propres opérations
    dans ce même fichier, sous /api, avant ton premier commit de code.

    Complétion (décisions tranchées en section 7 du cahier des charges) :
    endpoints ajoutés — présence manuelle du formateur et liste des présents
    d'une session, remplacement et
    consultation d'exercice, liste des relectures d'un relecteur — plus les
    codes 429/422 et le champ relecteurId exigés par EF4, EF5, EF7, EF8,
    EF10 et EF12.

servers:
  - url: http://localhost:8080

paths:

  /api/sessions:
    post:
      summary: Le formateur ouvre une session et obtient un code de présence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titre, promotionId]
              properties:
                titre: { type: string }
                promotionId: { type: integer, format: int64 }
      responses:
        "201":
          description: Session ouverte
          content:
            application/json:
              schema:
                type: object
                required: [id, code, ouvertureAt, expirationAt, statut]
                properties:
                  id: { type: integer, format: int64 }
                  code: { type: string }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
                  statut: { type: string, enum: [OUVERTE, CLOTUREE], default: OUVERTE }
        "400": { $ref: "#/components/responses/Erreur" }   # CHAMPS_REQUIS
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE (ajout EF1, décision section 7)

  /api/sessions/{id}/cloture:
    patch:
      summary: Le formateur clôture une session manuellement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Session clôturée
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string, enum: [OUVERTE, CLOTUREE] }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_DEJA_CLOTUREE

  /api/sessions/{id}/reouverture:
    patch:
      summary: Le formateur rouvre une session clôturée par erreur
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Session rouverte
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string, enum: [OUVERTE, CLOTUREE] }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_DEJA_OUVERTE

  /api/presences:
    post:
      summary: Un étudiant marque sa présence avec le code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, etudiantId]
              properties:
                code: { type: string }
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence enregistrée
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }   # CODE_INCONNU
        "404": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_INCONNU (ajout EF2, décision section 7)
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT | SESSION_CLOTUREE (ajout EF2, décision section 7)
        "410": { $ref: "#/components/responses/Erreur" }   # CODE_EXPIRE — prime sur SESSION_CLOTUREE quand les deux s'appliquent
        "429": { $ref: "#/components/responses/Erreur" }   # TROP_ECHECS (EF4/RG3 : blocage 2 min après 5 échecs)

  /api/sessions/{id}/presences:
    post:
      summary: Le formateur ajoute une présence manuellement (EF5, RG13)
      description: |
        Pas de 410 CODE_EXPIRE ici : RG1 (expiration à 15 min) ne s'applique
        qu'au code de présence. L'ajout manuel reste possible tant que la
        session est OUVERTE — décision tranchée en section 7 du cahier des charges.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [etudiantId]
              properties:
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence ajoutée par le formateur
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }   # CHAMPS_REQUIS
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE | ETUDIANT_INCONNU (inexistant ou hors de la promotion de la session, section 7)
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT | SESSION_CLOTUREE
    get:
      summary: Lister les présents d'une session, source incluse (EF5, RG13)
      description: |
        Rend vérifiable le critère d'EF5 « apparaît comme telle » : chaque
        présence porte sa source, l'écran formateur distingue les ajouts
        manuels (FORMATEUR) des saisies de code (ETUDIANT). Tri par heure de
        marquage — ajout additif, décision section 7.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Présents de la session
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, etudiantId, nom, source, marqueeAt]
                  properties:
                    id: { type: integer, format: int64 }
                    etudiantId: { type: integer, format: int64 }
                    nom: { type: string }
                    source: { type: string, enum: [ETUDIANT, FORMATEUR] }
                    marqueeAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE

  /api/exercices:
    post:
      summary: Un étudiant dépose le lien de son exercice
      description: |
        Le relecteur est assigné au dépôt, au hasard parmi les présents (EF8, RG6),
        hors de l'auteur (RG4). S'il n'existe aucun relecteur éligible, le dépôt
        est refusé en 422 (décision tranchée en section 7). Pour remplacer le lien
        d'un exercice déjà déposé (EF7, RG12), utilisez PUT /api/exercices/{id}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId, lien]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
                lien: { type: string, format: uri }
      responses:
        "201":
          description: Exercice déposé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string, enum: [EN_ATTENTE_RELECTURE, RELU] }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE (URL http(s) absolue, 2048 car. max) | CHAMPS_REQUIS
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE | ETUDIANT_INCONNU (inexistant ou hors promotion, section 7)
        "409": { $ref: "#/components/responses/Erreur" }   # EXERCICE_DEJA_DEPOSE (utilisez PUT) | SESSION_CLOTUREE (RG11)
        "422": { $ref: "#/components/responses/Erreur" }   # AUCUN_RELECTEUR_DISPONIBLE

  /api/exercices/{id}:
    put:
      summary: L'étudiant remplace le lien de son exercice (EF7, RG12)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [etudiantId, lien]
              properties:
                etudiantId: { type: integer, format: int64, description: Auteur de l'exercice — vérifie que le remplacement est fait par le déposant }
                lien: { type: string, format: uri }
      responses:
        "200":
          description: Lien remplacé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string, enum: [EN_ATTENTE_RELECTURE, RELU] }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE | CHAMPS_REQUIS
        "403": { $ref: "#/components/responses/Erreur" }   # NON_AUTEUR — etudiantId n'est pas l'auteur (ajout EF7, section 7)
        "404": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEJA_COMMENCEE — relecture déjà rendue (section 7) ; indépendant de la clôture (RG12)
    get:
      summary: Consulter le détail d'un exercice, note et commentaire inclus (EF12, RG7)
      description: |
        Aucun champ de cette réponse n'identifie le relecteur — c'est ce qui
        garantit RG7. À l'implémentation, un DTO dédié : ne jamais exposer
        l'entité JPA complète.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Détail de l'exercice
          content:
            application/json:
              schema:
                type: object
                required: [id, lien, statut]
                properties:
                  id: { type: integer, format: int64 }
                  lien: { type: string, format: uri }
                  statut: { type: string, enum: [EN_ATTENTE_RELECTURE, RELU] }
                  note: { type: integer, nullable: true }
                  commentaire: { type: string, nullable: true }
        "404": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INCONNU

  /api/relectures/{id}:
    post:
      summary: Un relecteur rend sa note et son commentaire
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [relecteurId, note, commentaire]
              properties:
                relecteurId: { type: integer, format: int64, description: Identifiant du relecteur qui soumet — nécessaire pour vérifier EF10 (403 AUTO_RELECTURE) }
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200":
          description: Relecture enregistrée — définitive (RG9) ; corps ajouté à l'implémentation EF9
          content:
            application/json:
              schema:
                type: object
                required: [id, exerciceId, note, commentaire, rendueAt]
                properties:
                  id: { type: integer, format: int64 }
                  exerciceId: { type: integer, format: int64 }
                  note: { type: integer, minimum: 0, maximum: 20 }
                  commentaire: { type: string }
                  rendueAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Erreur" }   # NOTE_INVALIDE (hors 0–20 ou non entière ; 12.0 accepté) | CHAMPS_REQUIS | COMMENTAIRE_INVALIDE (> 4000 car.) | PARAMETRE_INVALIDE
        "403": { $ref: "#/components/responses/Erreur" }   # AUTO_RELECTURE | RELECTEUR_NON_ASSIGNE (ni auteur ni relecteur assigné, section 7)
        "404": { $ref: "#/components/responses/Erreur" }   # RELECTURE_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEJA_RENDUE

  /api/relectures:
    get:
      summary: Lister les relectures assignées à un relecteur (EF9)
      description: |
        Écran « relecteur » — sans cette opération, le relecteur ne peut pas
        savoir qu'une relecture lui est assignée.
      parameters:
        - name: relecteurId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Relectures à faire ou déjà rendues
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, exerciceId, exerciceLien, rendue]
                  properties:
                    id: { type: integer, format: int64 }
                    exerciceId: { type: integer, format: int64 }
                    exerciceLien: { type: string, format: uri }
                    rendue: { type: boolean }
        "400": { $ref: "#/components/responses/Erreur" }   # CHAMPS_REQUIS (relecteurId absent) | PARAMETRE_INVALIDE
        "404": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_INCONNU (ajout EF9 ; liste vide si l'étudiant existe sans relecture)

  /api/tableau:
    get:
      summary: Le tableau récapitulatif du formateur
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Récapitulatif par étudiant
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    [etudiantId, nom, presences, exercicesDeposes, moyenne, relecturesEnAttente]
                  properties:
                    etudiantId: { type: integer, format: int64 }
                    nom: { type: string }
                    presences: { type: integer }
                    exercicesDeposes: { type: integer }
                    moyenne: { type: number, nullable: true }
                    relecturesEnAttente: { type: integer }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

components:
  schemas:
    Erreur:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Identifiant stable, en majuscules. Exemple - CODE_EXPIRE
        message:
          type: string
          description: Phrase lisible par un humain, en français
  responses:
    Erreur:
      description: |
        Format d'erreur imposé pour TOUTES les erreurs, sans exception.
        Une stack trace, un corps vide ou la page d'erreur par défaut de Spring
        valent zéro sur ce critère.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
          example:
            code: CODE_EXPIRE
            message: Le code de présence a expiré.